name: Build and Push to ACR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          # short SHA = first 7 chars of commit hash
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Will tag image as: ${SHORT_SHA}"

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: vidlab02acrprod01.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            vidlab02acrprod01.azurecr.io/vidlab-app:${{ steps.meta.outputs.tag }}
            vidlab02acrprod01.azurecr.io/vidlab-app:latest